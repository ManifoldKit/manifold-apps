name: Manifold
options:
  bundleIdPrefix: com.manifoldkit
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  # Remote, published-tag pin, floating within upToNextMinor — deliberate.
  # The generated project (and any Package.resolved it would produce) is
  # gitignored, so nothing locks the resolved patch/minor; if an API this
  # repo needs isn't in a released tag yet, report the gap rather than
  # repointing at a branch or a local path.
  ManifoldKit:
    url: https://github.com/ManifoldKit/ManifoldKit
    minorVersion: 0.76.0
  ManifoldMLX:
    url: https://github.com/ManifoldKit/manifold-mlx
    minorVersion: 0.5.2
  ManifoldLlama:
    url: https://github.com/ManifoldKit/manifold-llama
    minorVersion: 0.4.5

targets:
  Manifold:
    type: application
    platform: iOS
    sources:
      - Mobile
      - Shared
    dependencies:
      - package: ManifoldKit
        product: ManifoldKit
      - package: ManifoldKit
        product: ManifoldTools
      - package: ManifoldKit
        product: ManifoldUIModelManagement
      - package: ManifoldKit
        product: ManifoldAppIntents
      - package: ManifoldMLX
        product: ManifoldMLX
      - package: ManifoldLlama
        product: ManifoldLlama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manifoldkit.Manifold
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: Mobile/Manifold.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Mobile/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # ChatView's composer shows a voice-input trigger regardless of
        # whether ManifoldVoice is linked; without this key it fires a
        # composer fault banner on first launch (same as core's
        # MinimalExample).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Voice input transcribes your speech into the message composer."

  ManifoldMac:
    type: application
    platform: macOS
    productName: Manifold
    sources:
      - Mac
      - Shared
    dependencies:
      - package: ManifoldKit
        product: ManifoldKit
      - package: ManifoldKit
        product: ManifoldTools
      - package: ManifoldKit
        product: ManifoldUIModelManagement
      - package: ManifoldKit
        product: ManifoldAppIntents
      - package: ManifoldMLX
        product: ManifoldMLX
      - package: ManifoldLlama
        product: ManifoldLlama
    settings:
      base:
        PRODUCT_NAME: Manifold
        PRODUCT_BUNDLE_IDENTIFIER: com.manifoldkit.Manifold
        INFOPLIST_KEY_CFBundleDisplayName: Manifold
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Voice input transcribes your speech into the message composer."
      configs:
        # Ad-hoc Debug-only signing so an unregistered Mac can build/run
        # (ManifoldKit issue #2453 M4 recipe, commit 05d226d9). Release is
        # untouched — this repo has no macOS Release/archive lane yet.
        Debug:
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"

  ManifoldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ManifoldUITests
      - Shared/Support/LaunchArguments.swift
      - Shared/Support/InboundPayload/InboundPayloadEnvelope.swift
      - Shared/Support/InboundPayload/Concurrency/PendingPayloadBuffer.swift
      - Shared/Features/AppIntents/InboundAppIntentRoute.swift
      - Shared/Features/AppIntents/InboundAppIntentHandoff.swift
      - Shared/Features/AppIntents/InboundAppIntentEnvelopeStore.swift
      - Shared/Features/AppIntents/ModelReadinessGate.swift
    dependencies:
      - target: Manifold
      - package: ManifoldKit
        product: ManifoldInference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manifoldkit.ManifoldUITests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  ManifoldMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - MacUITests
      - ManifoldUITests/UITestHelpers.swift
    dependencies:
      - target: ManifoldMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manifoldkit.ManifoldMacUITests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Manifold:
    build:
      targets:
        Manifold: all
        ManifoldUITests: [test]
    test:
      targets:
        - ManifoldUITests
    run:
      config: Debug
    archive:
      config: Release
  ManifoldMac:
    build:
      targets:
        ManifoldMac: all
        ManifoldMacUITests: [test]
    test:
      targets:
        - ManifoldMacUITests
      environmentVariables:
        MANIFOLD_MAC_REAL_MODEL_TEST: "$(MANIFOLD_MAC_REAL_MODEL_TEST)"
        MANIFOLD_MAC_REAL_MLX_MODEL_PATH: "$(MANIFOLD_MAC_REAL_MLX_MODEL_PATH)"
        MANIFOLD_MAC_REAL_GGUF_MODEL_PATH: "$(MANIFOLD_MAC_REAL_GGUF_MODEL_PATH)"
        MANIFOLD_MAC_REAL_MLX_MODEL_BYTES: "$(MANIFOLD_MAC_REAL_MLX_MODEL_BYTES)"
        MANIFOLD_MAC_REAL_GGUF_MODEL_BYTES: "$(MANIFOLD_MAC_REAL_GGUF_MODEL_BYTES)"
    run:
      config: Debug
    archive:
      config: Release
